<script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.13/dist/hls.min.js"></script>
<script>
const get = id => document.getElementById(id);
for (const button of document.querySelectorAll('.close-floating-banner')) {
  button.addEventListener('click', () => { button.closest('aside').hidden = true; });
}

get('search').addEventListener('focus', () => {
  if (location.hash.startsWith('#clip=')) location.hash = '';
});
const rows = JSON.parse(get('data').textContent);
const byId = new Map(rows.map(row => [row[0], row]));
const pageSize = 24;
let selectedCategory = '';
const covers = new Map();
const sourceTitleSuffix = /(?:\s*[-–—|]\s*)?รักหี\s+คลิปหลุด\s+แหล่งรวม\s*xxx\s*สำหรับคนรักหี\s+รักหี\.com\s*$/iu;
function clipTitle(title, id) {
  return typeof title === 'string' && title.replace(sourceTitleSuffix, '').replace(/รักหี(?:\.com)?/giu, '').replace(/\s*[-–—|]\s*$/, '').trim() || 'วิดีโอ';
}

function coverFor(id) {
  if (location.protocol === 'file:') return Promise.resolve(null);
  if (!covers.has(id)) {
    const request = fetch('/cover/' + id).then(response => {
      if (!response.ok) throw new Error('Cover unavailable');
      return response.json();
    }).catch(() => {
      covers.delete(id);
      return null;
    });
    covers.set(id, request);
  }
  return covers.get(id);
}
const categories = ['', ...new Set(rows.map(row => row[1]))];
for (const category of categories) {
  const button = document.createElement('button');
  button.type = 'button';
  button.textContent = category || 'ทั้งหมด';
  button.setAttribute('aria-pressed', String(!category));
  button.dataset.category = category;
  button.onclick = () => {
    location.hash = category ? 'category=' + encodeURIComponent(category) : '';
  };
  get('categories').append(button);
}
let page = 1;
function list() {
  const query = get('search').value.trim().toLowerCase();
  const featured = get('featured');
  featured.hidden = Boolean(query || selectedCategory || page !== 1);
  if (!featured.hidden && !get('featured-items').children.length) {
    const featuredIds = ['6758', '6764', '6701'];
    const featuredRows = [...featuredIds.map(id => byId.get(id)).filter(Boolean),
      ...rows.filter(([id]) => !featuredIds.includes(id)).slice(0, 2)];
    get('featured-items').replaceChildren(...featuredRows.map(makeCard));
  }
  const matches = rows.filter(([id, category]) => (!selectedCategory || category === selectedCategory) && (id.includes(query) || category.toLowerCase().includes(query)));
  const pages = Math.max(1, Math.ceil(matches.length / pageSize));
  get('count').textContent = matches.length.toLocaleString('th-TH') + ' รายการ';
  get('items').replaceChildren(...matches.slice((page - 1) * pageSize, page * pageSize).map(makeCard));
  get('prev').disabled = page === 1;
  get('next').disabled = page >= pages;
  get('page').textContent = page + ' / ' + pages;
}
function makeCard([id]) {
  const card = document.createElement('li');
  const link = document.createElement('a');
  link.href = '#clip=' + id;
  const preview = document.createElement('span');
  preview.className = 'cover';
  preview.setAttribute('aria-hidden', 'true');
  preview.classList.add('card-preview');
  preview.textContent = '▶';
  const image = document.createElement('img');
  image.alt = '';
  image.decoding = 'async';
  image.addEventListener('load', () => preview.replaceChildren(image), { once: true });
  const label = document.createElement('span');
  label.className = 'caption';
  label.textContent = 'วิดีโอ';
  link.append(preview, label);
  card.append(link);
  coverFor(id).then(data => {
    if (!data || !link.isConnected) return;
    label.textContent = clipTitle(data.title, id);
    if (data.image) image.src = data.image;
  });
  return card;
}
let player;
let pending;
const video = get('video');
const videoLoading = get('video-loading');
for (const event of ['canplay', 'playing', 'pause', 'ended']) {
  video.addEventListener(event, () => { videoLoading.hidden = true; });
}
video.addEventListener('waiting', () => {
  if (!video.hidden && !video.paused) videoLoading.hidden = false;
});
video.addEventListener('error', () => {
  if (video.hidden || !video.error) return;
  resetVideo();
  get('status').textContent = 'เปิดวิดีโอไม่ได้ ลองใหม่อีกครั้ง';
});

function resetVideo() {
  pending?.abort();
  player?.destroy();
  player = undefined;
  videoLoading.hidden = true;
  video.removeAttribute('src');
  video.load();
  video.hidden = true;
  get('play').disabled = false;
  get('play').hidden = false;
  get('status').textContent = '';
}
get('play').onclick = async () => {
  if (location.protocol === 'file:') {
    get('status').textContent = 'เปิดหน้าเว็บผ่าน start-clips.cmd ก่อนเล่น';
    return;
  }
  const id = new URLSearchParams(location.hash.slice(1)).get('clip');
  const request = new AbortController();
  pending = request;
  get('play').disabled = true;
  get('status').textContent = '';
  videoLoading.hidden = false;
  try {
    const response = await fetch('/stream/' + id, { signal: request.signal });
    if (!response.ok) throw new Error('Stream unavailable');
    const {url} = await response.json();
    if (request.signal.aborted) return;
    video.hidden = false;
    get('play').hidden = true;
    if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = url;
    } else if (window.Hls?.isSupported()) {
      player = new Hls();
      player.on(Hls.Events.ERROR, (_, data) => {
        if (data.fatal) {
          resetVideo();
          get('status').textContent = 'ต้นทางส่งวิดีโอไม่สำเร็จ ลองเล่นใหม่';
        }
      });
      player.loadSource(url);
      player.attachMedia(video);
    } else {
      throw new Error('HLS unsupported');
    }
    get('status').textContent = '';
    video.play().catch(error => {
      if (!request.signal.aborted && error.name === 'NotAllowedError') videoLoading.hidden = true;
    });
  } catch (error) {
    if (request.signal.aborted) return;
    resetVideo();
    get('status').textContent = 'เปิดสตรีมไม่ได้ ลองใหม่อีกครั้ง';
  }
};
function route() {
  resetVideo();
  const params = new URLSearchParams(location.hash.slice(1));
  const clip = byId.get(params.get('clip'));
  document.body.classList.toggle('is-watch-page', Boolean(clip));
  get('browse').hidden = Boolean(clip);
  get('watch').hidden = !clip;
  if (!clip) {
    const requested = params.get('category') || '';
    const category = categories.includes(requested) ? requested : '';
    if (selectedCategory !== category) page = 1;
    selectedCategory = category;
    get('catalog-title').textContent = category || 'คลิปอัปเดตล่าสุด';
    for (const item of get('categories').children) {
      item.setAttribute('aria-pressed', String(item.dataset.category === category));
    }
    document.title = (category || 'คลังคลิป') + ' | ชอบหี';
    list();
    return;
  }
  const [id, category] = clip;
  get('title').textContent = 'คลิป ' + id;
  document.title = 'คลิป ' + id + ' | ชอบหี';
  get('category').textContent = category;
  get('category').href = '#category=' + encodeURIComponent(category);
  const image = get('watch-cover');
  image.hidden = true;
  image.removeAttribute('src');
  image.onload = () => { image.hidden = false; };
  image.onerror = () => { image.hidden = true; };
  get('related').replaceChildren(...rows.filter(row => row[1] === category && row[0] !== id).slice(0, 6).map(makeCard));
  coverFor(id).then(data => {
    if (!data || new URLSearchParams(location.hash.slice(1)).get('clip') !== id) return;
    if (data.image) image.src = data.image;
    const title = clipTitle(data.title, id);
    get('title').textContent = title;
    document.title = title + ' | ชอบหี';
  });
  window.scrollTo(0, 0);
}
const search = get('search');
const results = get('results');
function showSearchResults() {
  const query = search.value.trim().toLowerCase();
  const matches = query
    ? rows.filter(([id, category]) => id.includes(query) || category.toLowerCase().includes(query)).slice(0, 5)
    : rows.slice(0, 3);
  const heading = document.createElement('strong');
  heading.textContent = query ? (matches.length ? 'ผลการค้นหา' : 'ไม่พบรายการ') : 'คลิปอัปเดตล่าสุด';
  results.replaceChildren(heading);
  for (const [id, category] of matches) {
    const link = document.createElement('a');
    link.href = '#clip=' + id;
    const title = document.createElement('span');
    title.textContent = 'วิดีโอ';
    link.append(title);
    coverFor(id).then(data => {
      if (data && link.isConnected) title.textContent = clipTitle(data.title, id);
    });
    const detail = document.createElement('small');
    detail.textContent = category;
    link.append(detail);
    link.addEventListener('click', () => { results.hidden = true; });
    results.append(link);
  }
  results.hidden = false;
}
search.addEventListener('focus', showSearchResults);
search.oninput = () => { page = 1; list(); showSearchResults(); };
get('searchform').onsubmit = event => {
  event.preventDefault();
  page = 1;
  results.hidden = true;
  if (location.hash) location.hash = '';
  else list();
};
get('header-search').addEventListener('focusout', event => {
  if (!get('header-search').contains(event.relatedTarget)) results.hidden = true;
});
get('header-search').addEventListener('keydown', event => {
  if (event.key === 'Escape') results.hidden = true;
});
get('prev').onclick = () => { page--; list(); };
get('next').onclick = () => { page++; list(); };
const featuredRail = get('featured-items');
const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
let lastInteraction = 0;
for (const event of ['pointerdown', 'wheel']) {
  featuredRail.addEventListener(event, () => { lastInteraction = Date.now(); }, { passive: true });
}
window.setInterval(() => {
  if (document.hidden || reducedMotion.matches || get('featured').hidden || get('browse').hidden ||
      featuredRail.matches(':hover, :focus-within') || Date.now() - lastInteraction < 5000) return;
  const first = featuredRail.children[0];
  const second = featuredRail.children[1];
  const end = featuredRail.scrollWidth - featuredRail.clientWidth;
  if (!first || !second || end <= 1) return;
  const step = second.offsetLeft - first.offsetLeft;
  const left = featuredRail.scrollLeft >= end - 2 ? 0 : Math.min(end, featuredRail.scrollLeft + step);
  featuredRail.scrollTo({ left, behavior: 'smooth' });
}, 4000);
window.addEventListener('hashchange', route);
route();
</script></html>
